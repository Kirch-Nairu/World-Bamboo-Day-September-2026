name: Pilot CI

on:
  push:
    branches:
      - pilot/static-qr-backend-v0
  pull_request:
    branches:
      - prototype/interactive-proposal-v0
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build with webpack
        run: npm run build:webpack

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Restore backend
        run: dotnet restore backend/WorldBamboo.Api/WorldBamboo.Api.csproj
      - name: Build backend
        run: dotnet build backend/WorldBamboo.Api/WorldBamboo.Api.csproj --configuration Release --no-restore
